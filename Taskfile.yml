version: "3"

vars:
  MODULE:
    sh: go list -m

tasks:
  deps:
    desc: Download and normalize Go dependencies
    sources:
      - go.mod
      - go.sum
    cmds:
      - go mod download
      - go mod tidy

  fmt:
    desc: Format Go source
    deps: [deps]
    cmds:
      - gci write -s standard -s default -s "prefix(github.com/go-theft-craft)" -s "prefix({{.MODULE}})" .
      - gofumpt -w .

  fmt:check:
    desc: Check Go formatting without changing files
    deps: [deps]
    cmds:
      - |
        formatting_diff="$(golangci-lint fmt --diff)"
        if [ -n "$formatting_diff" ]; then
          printf '%s\n' "$formatting_diff"
          exit 1
        fi

  lint:
    desc: Run static analysis
    deps: [fmt:check]
    cmds:
      - golangci-lint run

  secrets:
    desc: Scan the repository tree for secrets and private keys
    cmds:
      - gitleaks dir --no-banner --redact --verbose .

  secrets:staged:
    desc: Scan staged changes for secrets and private keys
    cmds:
      - gitleaks git --no-banner --redact --verbose --staged

  precommit:
    desc: Run checks required before a commit
    cmds:
      - task: lint
      - task: secrets:staged

  test:
    desc: Run unit tests with the race detector
    deps: [deps]
    cmds:
      - go test -race -covermode=atomic -coverprofile=coverage.out {{.CLI_ARGS | default "./..."}}

  test:fast:
    desc: Run unit tests without the race detector, for the edit loop
    deps: [deps]
    # The same tests as test, and the reason to have both is measured rather
    # than assumed: on this tree the race build takes 23 seconds after an edit
    # and the plain one takes 2. That difference is the race detector's
    # instrumented rebuild, which every source change invalidates, so paying it
    # on each edit buys nothing that paying it once before a commit does not.
    #
    # This is not a replacement for test. Data races are exactly the failure
    # that does not show up when you look for it, and verify still runs the
    # race lane; this is what to run in between.
    cmds:
      - go test {{.CLI_ARGS | default "./..."}}

  interop:deps:
    desc: Install the pinned Node dependencies the interop lanes run against
    # Its own task so the lanes below can share it and Task can skip it. npm ci
    # deletes and reinstalls node_modules by design, which is what makes it
    # reproducible and what makes it worth doing only when the lockfile moves.
    sources:
      - interop/node/package.json
      - interop/node/package-lock.json
    generates:
      - interop/node/node_modules/.package-lock.json
    cmds:
      - npm ci --prefix interop/node

  test:interop:
    desc: Run loopback interoperability tests against pinned Node minecraft-protocol
    deps: [deps, interop:deps]
    cmds:
      - go test -race -count=1 ./interop

  test:protodef:
    desc: Compare the generated protocol 775 codecs against pinned Node ProtoDef
    deps: [deps, interop:deps]
    # A subset of test:interop, kept for running the differential lane on its
    # own. verify runs test:interop and not this, because every test this
    # selects is one that lane already ran.
    cmds:
      - go test -race -count=1 -run "ProtoDef|Protocol775Differential" ./interop

  check:live:
    desc: Run the opt-in live check against a real Java 26.1 server (needs MCPROTO_LIVE_ADDR)
    deps: [deps]
    cmds:
      - go test -tags livecheck -count=1 -v ./livecheck

  test:cli:
    desc: Run the black-box mcproto command tests
    deps: [deps]
    cmds:
      - go test -race -count=1 ./cmd/mcproto

  test:fuzz:
    desc: Smoke the capture reader fuzz target
    deps: [deps]
    cmds:
      - go test -run FuzzCaptureReader -fuzz FuzzCaptureReader -fuzztime 30s ./capture

  vuln:
    desc: Check dependencies for known vulnerabilities
    deps: [deps]
    cmds:
      - govulncheck ./...

  build:
    desc: Build every package
    deps: [deps]
    cmds:
      - go build ./...

  data:fetch:v26_1:
    desc: Re-fetch the pinned PrismarineJS Java 26.1 data tree
    cmds:
      - >-
        go run ./cmd/mcproto data fetch
        --edition java --version 26.1 --protocol 775
        --revision 8a80816cbfb3fe2b609f2cde4e57796c8033af61
        --output ./source/java/26.1

  data:validate:
    desc: Check every pinned source tree against its own manifest
    cmds:
      - go run ./cmd/mcproto data validate --source ./source/java/1.8
      - go run ./cmd/mcproto data validate --source ./source/java/26.1

  generate:v1_8:
    desc: Generate the Java 1.8 game-data package
    cmds:
      - go run ./cmd/mcdata-gen -source ./source/java/1.8 -out ./generated/java -package v1_8 -version java/1.8.9

  generate:v26_1:
    desc: Generate the Java 26.1 game-data package, its raw datasets, and its coverage report
    cmds:
      - >-
        go run ./cmd/mcdata-gen -raw -coverage
        -source ./source/java/26.1 -out ./generated/java -package v26_1 -version java/26.1

  generate:
    desc: Generate every supported version's package
    cmds:
      - task: generate:v1_8
      - task: generate:v26_1

  generate:check:
    desc: Verify that every checked-in generated package is current
    cmds:
      - go run ./cmd/mcdata-gen -check -source ./source/java/1.8 -out ./generated/java -package v1_8 -version java/1.8.9
      - >-
        go run ./cmd/mcdata-gen -check -raw -coverage
        -source ./source/java/26.1 -out ./generated/java -package v26_1 -version java/26.1

  verify:
    desc: Run all local and CI checks
    cmds:
      - task: data:validate
      - task: generate:check
      - task: lint
      - task: secrets
      - task: test
      - task: test:interop
      - task: vuln
      - task: build

  release:check:
    desc: Verify a clean release candidate
    requires:
      vars: [VERSION]
    cmds:
      - task: verify
      - cmd: test -z "$(git status --porcelain)"
        platforms: [linux, darwin]
      - cmd: '! grep -Eq ''^replace[[:space:]]'' go.mod'
        platforms: [linux, darwin]
      - cmd: printf '%s\n' '{{.VERSION}}' | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$'
        platforms: [linux, darwin]

  default:
    cmds:
      - task --list
